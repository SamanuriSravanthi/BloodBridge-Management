<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Join as a donor | SAVE LIFE</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<div th:replace="~{fragments/nav :: navbar}"></div>
	<main class="container narrow-page py-5">
		<div class="card border-0 shadow-sm">
			<div class="card-body p-4 p-md-5">
				<h1 class="h3 mb-2">Create your donor account</h1>
				<p class="text-secondary mb-4">Your password is securely hashed before it is saved.</p>
				<form th:action="@{/register}" th:object="${registrationForm}" method="post" novalidate>
					<div class="mb-3">
						<label class="form-label" for="fullName">Full name</label>
						<input class="form-control" th:field="*{fullName}" id="fullName" autocomplete="name" required>
						<div class="field-error" th:errors="*{fullName}"></div>
					</div>
					<div class="mb-3">
						<label class="form-label" for="email">Email address</label>
						<input class="form-control" th:field="*{email}" id="email" type="email" autocomplete="email" required>
						<div class="field-error" th:errors="*{email}"></div>
					</div>
					<div class="mb-3">
						<label class="form-label" for="password">Password</label>
						<input class="form-control" th:field="*{password}" id="password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required>
						<div class="form-text">Use at least 12 characters. Passwords must fit the 72-byte BCrypt limit.</div>
						<div class="field-error" th:errors="*{password}"></div>
					</div>
					<button class="btn btn-danger w-100" type="submit">Create account</button>
				</form>
				<p class="mt-4 mb-0 text-center">Already registered? <a th:href="@{/login}">Log in</a></p>
			</div>
		</div>
	</main>
</body>
</html>
