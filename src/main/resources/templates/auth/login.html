<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Log in | SAVE LIFE</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<div th:replace="~{fragments/nav :: navbar}"></div>
	<main class="container narrow-page py-5">
		<div class="card border-0 shadow-sm">
			<div class="card-body p-4 p-md-5">
				<h1 class="h3 mb-4">Welcome back</h1>
				<div class="alert alert-success" th:if="${param.registered}">Your account is ready. You can now log in.</div>
				<div class="alert alert-danger" th:if="${param.error}">Email or password is incorrect.</div>
				<div class="alert alert-info" th:if="${param.logout}">You have been logged out.</div>
				<form th:action="@{/login}" method="post">
					<div class="mb-3">
						<label class="form-label" for="username">Email address</label>
						<input class="form-control" id="username" name="username" type="email" autocomplete="username" required>
					</div>
					<div class="mb-3">
						<label class="form-label" for="password">Password</label>
						<input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
					</div>
					<button class="btn btn-danger w-100" type="submit">Log in</button>
				</form>
				<p class="mt-4 mb-0 text-center">New here? <a th:href="@{/register}">Create a donor account</a></p>
			</div>
		</div>
	</main>
</body>
</html>
