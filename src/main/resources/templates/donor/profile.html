<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Donor profile | SAVE LIFE</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<div th:replace="~{fragments/nav :: navbar}"></div>
	<main class="container narrow-page py-5">
		<div class="card border-0 shadow-sm">
			<div class="card-body p-4 p-md-5">
				<h1 class="h3 mb-4">Your donor profile</h1>
				<form th:action="@{/profile}" th:object="${profileForm}" method="post" novalidate>
					<div class="mb-3">
						<label class="form-label" for="bloodGroup">Blood group</label>
						<select class="form-select" th:field="*{bloodGroup}" id="bloodGroup" required>
							<option value="">Choose your blood group</option>
							<option th:each="group : ${bloodGroups}" th:value="${group}" th:text="${#strings.replace(group, '_', ' ')}"></option>
						</select>
						<div class="field-error" th:errors="*{bloodGroup}"></div>
					</div>
					<div class="mb-3">
						<label class="form-label" for="city">City</label>
						<input class="form-control" th:field="*{city}" id="city" maxlength="100" required>
						<div class="field-error" th:errors="*{city}"></div>
					</div>
					<div class="mb-3">
						<label class="form-label" for="phone">Phone number</label>
						<input class="form-control" th:field="*{phone}" id="phone" type="tel" maxlength="20" required>
						<div class="field-error" th:errors="*{phone}"></div>
					</div>
					<div class="form-check mb-4">
						<input class="form-check-input" th:field="*{available}" id="available" type="checkbox">
						<label class="form-check-label" for="available">I am currently available to donate</label>
					</div>
					<div class="d-flex gap-2">
						<button class="btn btn-danger" type="submit">Save profile</button>
						<a class="btn btn-outline-secondary" th:href="@{/dashboard}">Cancel</a>
					</div>
				</form>
			</div>
		</div>
	</main>
</body>
</html>
