<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
	<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-danger shadow-sm">
		<div class="container">
			<a class="navbar-brand fw-bold" th:href="@{/}">SAVE LIFE</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
				aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="mainNav">
				<div class="navbar-nav me-auto">
					<a class="nav-link" th:href="@{/requests}">Blood requests</a>
					<a class="nav-link" sec:authorize="hasRole('DONOR')" th:href="@{/dashboard}">My dashboard</a>
					<a class="nav-link" sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Admin</a>
				</div>
				<div class="navbar-nav align-items-lg-center gap-lg-2">
					<a class="nav-link" sec:authorize="isAnonymous()" th:href="@{/login}">Log in</a>
					<a class="btn btn-light btn-sm" sec:authorize="isAnonymous()" th:href="@{/register}">Join as a donor</a>
					<form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
						<button class="btn btn-outline-light btn-sm" type="submit">Log out</button>
					</form>
				</div>
			</div>
		</div>
	</nav>
</body>
</html>
