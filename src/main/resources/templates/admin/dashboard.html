<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Admin dashboard | SAVE LIFE</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<div th:replace="~{fragments/nav :: navbar}"></div>
	<main class="container py-5">
		<p class="text-danger fw-semibold text-uppercase mb-1">Administration</p>
		<h1 class="h2 mb-4">Dashboard</h1>
		<div class="row g-3 mb-4">
			<div class="col-sm-6"><div class="stat-card"><strong th:text="${donorCount}">0</strong><span>registered donor profiles</span></div></div>
			<div class="col-sm-6"><div class="stat-card"><strong th:text="${requestCount}">0</strong><span>total blood requests</span></div></div>
		</div>
		<div class="alert alert-success" th:if="${param.updated}">The request status has been updated.</div>
		<h2 class="h4 mb-3">Manage blood requests</h2>
		<div class="table-responsive bg-white rounded shadow-sm" th:if="${!#lists.isEmpty(requests)}">
			<table class="table align-middle mb-0">
				<thead><tr><th>Blood group</th><th>Hospital / city</th><th>Requested by</th><th>Status</th><th>Update</th></tr></thead>
				<tbody>
					<tr th:each="request : ${requests}">
						<td th:text="${#strings.replace(request.bloodGroup, '_', ' ')}">O POSITIVE</td>
						<td><strong th:text="${request.hospitalName}">Hospital</strong><br><span class="text-secondary small" th:text="${request.city}">City</span></td>
						<td th:text="${request.requester.fullName}">Requester</td>
						<td><span class="badge text-bg-secondary" th:text="${request.status}">OPEN</span></td>
						<td>
							<form class="d-flex gap-2" th:action="@{/admin/requests/{id}/status(id=${request.id})}" method="post">
								<select class="form-select form-select-sm" name="status" aria-label="Request status">
									<option th:each="status : ${statuses}" th:value="${status}" th:text="${status}" th:selected="${status == request.status}"></option>
								</select>
								<button class="btn btn-sm btn-outline-danger" type="submit">Save</button>
							</form>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
		<p class="text-secondary" th:if="${#lists.isEmpty(requests)}">No blood requests have been submitted yet.</p>
	</main>
</body>
</html>
