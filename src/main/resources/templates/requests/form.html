<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Post a blood request | SAVE LIFE</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<div th:replace="~{fragments/nav :: navbar}"></div>
	<main class="container narrow-page py-5">
		<div class="card border-0 shadow-sm">
			<div class="card-body p-4 p-md-5">
				<h1 class="h3 mb-2">Request blood</h1>
				<p class="text-secondary mb-4">Please share accurate contact information so donors can respond.</p>
				<form th:action="@{/requests}" th:object="${requestForm}" method="post" novalidate>
					<div class="mb-3">
						<label class="form-label" for="bloodGroup">Blood group needed</label>
						<select class="form-select" th:field="*{bloodGroup}" id="bloodGroup" required>
							<option value="">Choose a blood group</option>
							<option th:each="group : ${bloodGroups}" th:value="${group}" th:text="${#strings.replace(group, '_', ' ')}"></option>
						</select>
						<div class="field-error" th:errors="*{bloodGroup}"></div>
					</div>
					<div class="mb-3">
						<label class="form-label" for="units">Units needed</label>
						<input class="form-control" th:field="*{units}" id="units" type="number" min="1" max="20" required>
						<div class="field-error" th:errors="*{units}"></div>
					</div>
					<div class="mb-3">
						<label class="form-label" for="hospitalName">Hospital or care center</label>
						<input class="form-control" th:field="*{hospitalName}" id="hospitalName" maxlength="150" required>
						<div class="field-error" th:errors="*{hospitalName}"></div>
					</div>
					<div class="mb-3">
						<label class="form-label" for="city">City</label>
						<input class="form-control" th:field="*{city}" id="city" maxlength="100" required>
						<div class="field-error" th:errors="*{city}"></div>
					</div>
					<div class="mb-3">
						<label class="form-label" for="contactPhone">Contact phone</label>
						<input class="form-control" th:field="*{contactPhone}" id="contactPhone" type="tel" maxlength="20" required>
						<div class="field-error" th:errors="*{contactPhone}"></div>
					</div>
					<div class="mb-4">
						<label class="form-label" for="message">Additional information (optional)</label>
						<textarea class="form-control" th:field="*{message}" id="message" rows="3" maxlength="1000"></textarea>
						<div class="field-error" th:errors="*{message}"></div>
					</div>
					<div class="d-flex gap-2">
						<button class="btn btn-danger" type="submit">Submit request</button>
						<a class="btn btn-outline-secondary" th:href="@{/requests}">Cancel</a>
					</div>
				</form>
			</div>
		</div>
	</main>
</body>
</html>
