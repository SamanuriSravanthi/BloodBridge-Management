<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Blood requests | SAVE LIFE</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<div th:replace="~{fragments/nav :: navbar}"></div>
	<main class="container py-5">
		<div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
			<div><p class="text-danger fw-semibold text-uppercase mb-1">People need your help</p><h1 class="h2 mb-0">Open blood requests</h1></div>
			<a class="btn btn-danger" th:href="@{/requests/new}">Post a request</a>
		</div>
		<div class="alert alert-success" th:if="${param.created}">Your blood request has been submitted.</div>
		<div class="row g-3" th:if="${!#lists.isEmpty(requests)}">
			<div class="col-md-6 col-lg-4" th:each="request : ${requests}">
				<article class="card h-100 border-0 shadow-sm">
					<div class="card-body">
						<span class="badge text-bg-danger mb-2" th:text="${#strings.replace(request.bloodGroup, '_', ' ')}">O POSITIVE</span>
						<h2 class="h5" th:text="${request.hospitalName}">Hospital</h2>
						<p class="text-secondary mb-1" th:text="${request.city}">City</p>
						<p class="mb-2"><strong th:text="${request.units}">1</strong> unit(s) needed</p>
						<p class="small mb-2" th:if="${!#strings.isEmpty(request.message)}" th:text="${request.message}">Details</p>
						<p class="small mb-0"><strong>Contact:</strong> <span th:text="${request.contactPhone}">Phone</span></p>
					</div>
				</article>
			</div>
		</div>
		<div class="empty-state" th:if="${#lists.isEmpty(requests)}">
			<h2 class="h5">There are no open blood requests</h2>
			<p class="mb-0 text-secondary">When a request is submitted, it will appear here.</p>
		</div>
	</main>
</body>
</html>
